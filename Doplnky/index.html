<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEST - Doplnky</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0B1320;
      color: white;
      padding: 20px;
    }
    .box {
      max-width: 900px;
      margin: 0 auto;
      background: #274a77;
      border-radius: 20px;
      padding: 20px;
    }
    .item {
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
      background: rgba(0,0,0,0.2);
    }
    img {
      width: 100%;
      max-width: 260px;
      border-radius: 12px;
      display: block;
      margin-bottom: 12px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: 12px;
      margin-top: 12px;
    }
    button {
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      background: #D4AF37;
      color: #111;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>TEST načítania produktov</h1>
    <p id="status">Čakám...</p>
    <button onclick="loadProducts()">Načítať test produkty</button>
    <div id="list"></div>
  </div>

  <script>
    const API_BASE = 'https://virivkyapp.lechstav.workers.dev';

    const PRODUCT_URLS = [
      'https://www.virivkyonline.sk/konzolovy-slnecnik-270-x-270--vratane-zakladne-na-zemi--antracit/',
      'https://www.virivkyonline.sk/tepelne-cerpadlo-zealux/'
    ];

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function fetchProductDetail(url) {
      const testUrl = API_BASE + '/product-detail?url=' + encodeURIComponent(url) + '&_=' + Date.now();

      const response = await fetch(testUrl, {
        method: 'GET',
        cache: 'no-store',
        headers: {
          'Cache-Control': 'no-cache, no-store, must-revalidate',
          'Pragma': 'no-cache'
        }
      });

      const text = await response.text();

      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error('Worker nevrátil JSON. Odpoveď: ' + text.slice(0, 300));
      }

      if (!response.ok || !data.success || !data.product) {
        throw new Error(data.error || 'Neznáma chyba workeru');
      }

      return data.product;
    }

    async function loadProducts() {
      const status = document.getElementById('status');
      const list = document.getElementById('list');
      list.innerHTML = '';
      status.textContent = 'Načítavam...';

      for (const url of PRODUCT_URLS) {
        const wrap = document.createElement('div');
        wrap.className = 'item';
        wrap.innerHTML = '<strong>URL:</strong> ' + escapeHtml(url);
        list.appendChild(wrap);

        try {
          const product = await fetchProductDetail(url);

          wrap.innerHTML += `
            <p><strong>Názov:</strong> ${escapeHtml(product.title)}</p>
            <p><strong>Cena:</strong> ${escapeHtml(product.price)}</p>
            ${product.image ? `<img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.title)}">` : '<p>Bez obrázka</p>'}
            <pre>${escapeHtml(JSON.stringify(product.variants, null, 2))}</pre>
          `;
        } catch (error) {
          wrap.innerHTML += `<p style="color:#ffb3b3;"><strong>CHYBA:</strong> ${escapeHtml(error.message)}</p>`;
        }
      }

      status.textContent = 'Hotovo';
    }
  </script>
</body>
</html>
